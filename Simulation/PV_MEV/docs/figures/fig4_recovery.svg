/text><text x="112" y="175" text-anchor="end" fill="#1c2630">MPCC_D_F1</text><rect x="120" y="162" width="160.0" height="18" fill="#eb6834"/><rect x="276.0" y="162" width="4" height="18" rx="2" fill="#eb6834"/><text x="286.0" y="175" fill="#52514e">约 80 ms</text><text x="112" y="205" text-anchor="end" fill="#1c2630">MPCC_D_R</text><rect x="120" y="192" width="200.0" height="18" fill="#eb6834"/><rect x="316.0" y="192" width="4" height="18" rx="2" fill="#eb6834"/><text x="326.0" y="205" fill="#52514e">约 100 ms</text><text x="112" y="235" text-anchor="end" fill="#1c2630">MPCC_D_F10</text><rect x="120" y="222" width="500.0" height="18" fill="#eb6834"/><rect x="616.0" y="222" width="4" height="18" rx="2" fill="#eb6834"/><text x="626.0" y="235" fill="#52514e">约 250 ms</text><line x1="120" y1="278" x2="138" y2="278" stroke="#2a78d6" stroke-width="2"/><text x="144" y="282" fill="#52514e">无谐波补偿：由外环与内环决定</text><line x1="320" y1="278" x2="338" y2="278" stroke="#eb6834" stroke-width="2"/><text x="344" y="282" fill="#52514e">带谐波补偿：估计器窗口叠加</text></svg>